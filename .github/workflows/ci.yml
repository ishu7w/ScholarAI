name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — the latest push is the one
# whose result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No secrets are configured for this job, and that is deliberate: the
    # app must build and run in demo mode with zero env vars. If a change
    # makes Supabase or DATABASE_URL mandatory, this job is where it fails.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx next build
